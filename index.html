<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mobile Crypto Wallet</title>

<style>
:root{
  --bg:#0b0d12;
  --card:#151823;
  --blue:#1e88ff;
  --text:#fff;
  --muted:#9aa0a6;
}
*{box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,sans-serif}
body{margin:0;background:var(--bg);color:var(--text);height:100vh}
.screen{display:none;height:100vh;justify-content:center;align-items:center;padding:20px}
.screen.active{display:flex}
.card{width:100%;max-width:380px;background:var(--card);border-radius:20px;padding:24px}
h2{text-align:center;margin-bottom:16px}
input,select{
  width:100%;padding:14px;margin:8px 0;
  border:none;border-radius:14px;
  background:#202431;color:#fff
}
button{
  width:100%;padding:14px;margin-top:12px;
  border:none;border-radius:16px;
  background:var(--blue);color:#fff;font-weight:600
}
.link{text-align:center;margin-top:12px;font-size:13px;color:var(--muted)}
.link span{color:var(--blue);cursor:pointer}

/* WALLET */
#wallet{flex-direction:column}
.header{text-align:center;padding:28px}
.balance{font-size:36px;font-weight:700}
.actions{display:flex;justify-content:space-around;padding:10px}
.action{text-align:center;font-size:13px}
.action button{
  width:56px;height:56px;border-radius:50%;
  background:var(--blue);color:#fff;font-size:20px
}
.list{flex:1;width:100%}
.item{display:flex;justify-content:space-between;padding:14px 20px;border-bottom:1px solid #222}
.nav{display:flex;justify-content:space-around;padding:12px;background:#151823}
.nav button{background:none;color:var(--muted)}
.nav .active{color:#fff}

/* MODAL */
.modal{
  position:fixed;inset:0;
  background:rgba(0,0,0,.6);
  display:none;justify-content:center;align-items:center
}
.modal.active{display:flex}
</style>
</head>
<body>

<!-- AUTH -->
<section id="auth" class="screen active">
  <div class="card">
    <h2 id="authTitle">Crear cuenta</h2>
    <input id="name" placeholder="Nombre y apellidos">
    <input id="email" placeholder="Correo electrónico">
    <input id="pass" type="password" placeholder="Contraseña">
    <input id="pass2" type="password" placeholder="Confirmar contraseña">
    <button onclick="submitAuth()">Continuar</button>
    <div class="link">
      <span onclick="toggleAuth()">¿Ya tienes cuenta? Iniciar sesión</span>
    </div>
  </div>
</section>

<!-- WALLET -->
<section id="wallet" class="screen">
  <div class="header">
    <div id="balance" class="balance">290,18 $</div>
    <div style="color:var(--muted)">Main</div>
  </div>

  <div class="actions">
    <div class="action"><button onclick="openModal('send')">↑</button>Send</div>
    <div class="action"><button onclick="alert('Dirección copiada')">↓</button>Receive</div>
    <div class="action"><button onclick="openModal('buy')">+</button>Buy</div>
    <div class="action"><button onclick="alert('Swap demo')">⇄</button>Swap</div>
  </div>

  <div class="list">
    <div class="item"><span>Tether (USDT)</span><span>290</span></div>
    <div class="item"><span>Tron (TRX)</span><span>1</span></div>
    <div class="item"><span>Bitcoin</span><span>0</span></div>
    <div class="item"><span>Ethereum</span><span>0</span></div>
  </div>

  <div class="nav">
    <button class="active">Wallet</button>
    <button onclick="alert('Discover')">Discover</button>
    <button onclick="alert('Browser')">Browser</button>
    <button onclick="logout()">Salir</button>
  </div>
</section>

<!-- MODAL -->
<div id="modal" class="modal">
  <div class="card">
    <h2 id="modalTitle"></h2>
    <input id="amount" type="number" placeholder="Monto">
    <input id="address" placeholder="Dirección">
    <select id="network">
      <option>BEP20</option>
      <option>TRC20</option>
      <option>ERC20</option>
    </select>
    <button onclick="confirmTx()">Confirmar</button>
    <button style="background:#333" onclick="closeModal()">Cancelar</button>
  </div>
</div>

<script>
let isLogin=false;

function toggleAuth(){
  isLogin=!isLogin;
  document.getElementById('authTitle').innerText=isLogin?'Iniciar sesión':'Crear cuenta';
  document.getElementById('name').style.display=isLogin?'none':'block';
  document.getElementById('pass2').style.display=isLogin?'none':'block';
}

function submitAuth(){
  if(isLogin){
    const u=JSON.parse(localStorage.getItem('user'));
    if(!u||email.value!==u.email||pass.value!==u.pass) return alert('Credenciales incorrectas');
  }else{
    if(pass.value!==pass2.value) return alert('Las contraseñas no coinciden');
    localStorage.setItem('user',JSON.stringify({
      name:name.value,email:email.value,pass:pass.value,balance:290.18
    }));
  }
  localStorage.setItem('session','on');
  showWallet();
}

function showWallet(){
  auth.classList.remove('active');
  wallet.classList.add('active');
}

function logout(){
  localStorage.removeItem('session');
  location.reload();
}

function openModal(type){
  modal.classList.add('active');
  modalTitle.innerText=type==='send'?'Enviar cripto':'Agregar fondos';
}

function closeModal(){modal.classList.remove('active')}

function confirmTx(){
  let u=JSON.parse(localStorage.getItem('user'));
  let amt=parseFloat(amount.value||0);
  if(modalTitle.innerText.includes('Agregar')) u.balance+=amt;
  else u.balance-=amt;
  localStorage.setItem('user',JSON.stringify(u));
  balance.innerText=u.balance.toFixed(2)+' $';
  closeModal();
}

if(localStorage.getItem('session')==='on') showWallet();
</script>
</body>
</html>
